<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réservation confirmée · SISTA</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232E4ED8'/><path d='M16 4C16.5 13.2 18.8 15.5 28 16 18.8 16.5 16.5 18.8 16 28 15.5 18.8 13.2 16.5 4 16 13.2 15.5 15.5 13.2 16 4Z' fill='%23E63C90'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:'Ahsing'; src:url('fonts/ahsing-regular.otf') format('opentype'); font-weight:400 900; }
  @font-face { font-family:'Bricolage Grotesque'; src:url('fonts/BricolageGrotesque-Bold.ttf') format('truetype'); font-weight:700; }
  @font-face { font-family:'Bricolage Grotesque'; src:url('fonts/BricolageGrotesque-ExtraBold.ttf') format('truetype'); font-weight:800; }
  @font-face { font-family:'Space Mono'; src:url('fonts/SpaceMono-Bold.ttf') format('truetype'); font-weight:700; }
  :root{
    --cobalt:#2E4ED8; --magenta:#E63C90; --periwinkle:#6154DB; --cream:#EFF0E6; --lime:#B5D62A; --citron:#EEF0A6; --ink:#241827;
    --border-main:1.5px solid var(--ink); --radius-card:20px; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--periwinkle); color:var(--cream); font-family:'Hanken Grotesk', sans-serif; line-height:1.6; min-height:100vh; display:flex; align-items:center; }
  .wrap{ max-width:560px; margin:0 auto; padding:48px 24px; text-align:center; }
  .kick{ font-family:'Space Mono', monospace; font-weight:700; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--citron); }
  h1{ font-family:'Bricolage Grotesque', sans-serif; font-weight:800; font-size:38px; line-height:1.1; margin:14px 0 18px; }
  p{ font-size:16px; opacity:.9; margin:0 0 8px; }
  .card{
    background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.3); border-radius:var(--radius-card);
    padding:24px; margin:28px 0; text-align:left; font-family:'Space Mono',monospace; font-size:13px; font-weight:700;
  }
  .card div{ margin-bottom:8px; }
  .card div:last-child{ margin-bottom:0; }
  .btn{
    font-family:'Hanken Grotesk',sans-serif; font-weight:700; font-size:14px;
    border:var(--border-main); border-radius:var(--radius-pill);
    padding:14px 28px; display:inline-block; text-decoration:none;
    background:var(--citron); color:var(--ink); margin-top:8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="kick">Paiement confirmé</div>
    <h1>Ta place est réservée ✦</h1>
    <p>Merci ! Tu vas recevoir un email de confirmation avec tous les détails.</p>
    <div class="card">
      <div>📅 Jeudi 22 octobre · 18h–22h</div>
      <div>📍 Bord de Meuse · Liège</div>
    </div>
    <a href="index.html" class="btn">Retour au site SISTA</a>
  </div>
</body>
</html>
